<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>레슨 관리 시스템</title>
<style>
  :root{
    --blue:#3182F6;
    --blue-dark:#1B64DA;
    --blue-light:#EBF2FF;
    --bg:#F2F4F6;
    --card:#FFFFFF;
    --text:#191F28;
    --text-sub:#8B95A1;
    --border:#E5E8EB;
    --green:#12B886;
    --green-light:#E6FCF5;
    --red:#F04452;
    --red-light:#FFEEF0;
    --orange:#FF9F1C;
    --orange-light:#FFF4E5;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow: 0 2px 10px rgba(25,31,40,0.05), 0 0 1px rgba(25,31,40,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }
  .app-title{ font-size:22px; font-weight:800; letter-spacing:-0.5px; margin:0 0 4px; }
  .app-sub{ color:var(--text-sub); font-size:14px; margin:0; }
  .header-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .save-box{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .save-indicator{ font-size:12px; font-weight:700; color:var(--text-sub); }

  .tabs{
    display:flex; gap:6px; background:#fff; padding:6px; border-radius:999px;
    box-shadow:var(--shadow); margin-bottom:24px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .tab-btn{
    flex:1; white-space:nowrap; text-align:center; padding:11px 18px; border:none; background:transparent;
    border-radius:999px; font-size:14px; font-weight:700; color:var(--text-sub); cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ background:var(--blue); color:#fff; }

  .panel{ display:none; }
  .panel.active{ display:block; animation:fadein .2s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--card); border-radius:var(--radius-lg); padding:24px;
    box-shadow:var(--shadow); margin-bottom:18px;
  }
  .card-title{ font-size:16px; font-weight:800; margin:0 0 16px; display:flex; align-items:center; justify-content:space-between; }
  .card-title .hint{ font-size:12px; font-weight:500; color:var(--text-sub); }

  .kpi-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  @media(max-width:900px){ .kpi-grid{ grid-template-columns:repeat(2,1fr);} }
  .kpi{
    background:#fff; border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px;
  }
  .kpi.manual{ background:var(--orange-light); }
  .kpi-label{ font-size:13px; color:var(--text-sub); font-weight:600; }
  .kpi-value{ font-size:26px; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
  .kpi.manual .kpi-value{ color:#B8720B; }
  .kpi-value.blue{ color:var(--blue); }
  .kpi-input{
    width:80px; font-size:26px; font-weight:800; color:#B8720B; border:none; background:transparent; padding:0;
  }
  .kpi-input:focus{ outline:none; border-bottom:2px solid var(--orange); }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; padding:10px 10px; color:var(--text-sub); font-weight:700; font-size:12.5px;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover{ background:#FAFBFC; }
  tbody tr.conflict{ background:var(--red-light); }
  tbody tr.expired{ background:var(--orange-light); }

  input[type=text], input[type=number], input[type=date], select{
    width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--text);
  }
  input:focus, select:focus{ outline:none; border-color:var(--blue); }
  select{ padding-right:26px; } /* 네이티브 드롭다운 화살표와 글자가 겹치지 않도록 오른쪽 여백 확보 */
  .cell-input{ min-width:82px; }
  .cell-phone{ min-width:138px; }
  .cell-date{ min-width:134px; }
  .cell-money{ min-width:106px; }
  .cell-select{ min-width:108px; }
  .cell-status{ min-width:94px; }
  textarea.cell-reason{
    min-width:210px; width:100%; resize:none; overflow:hidden; line-height:1.5; display:block;
    padding:7px 9px; border:1px solid var(--border); border-radius:8px;
    font-family:inherit; font-size:13px; color:var(--text);
  }

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:999px; border:none;
    font-weight:700; font-size:13.5px; cursor:pointer; transition:all .15s ease;
  }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover{ background:var(--blue-dark); }
  .btn-ghost{ background:var(--blue-light); color:var(--blue); }
  .btn-ghost:hover{ background:#DCE9FF; }
  .btn-del{ background:transparent; color:var(--red); border:1px solid var(--red-light); padding:6px 10px; font-size:12px; border-radius:8px; font-weight:700; cursor:pointer; }
  .btn-del:hover{ background:var(--red-light); }

  .badge{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge-green{ background:var(--green-light); color:var(--green); }
  .badge-red{ background:var(--red-light); color:var(--red); }
  .badge-orange{ background:var(--orange-light); color:#B8720B; }
  .badge-gray{ background:#F2F4F6; color:var(--text-sub); }

  .form-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media(max-width:900px){ .form-grid{ grid-template-columns:repeat(2,1fr);} }
  .form-field label{ display:block; font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:5px; }

  .note{ background:var(--blue-light); color:var(--blue-dark); border-radius:var(--radius-sm); padding:12px 16px; font-size:12.5px; margin-bottom:16px; line-height:1.6; }
  .note.warn{ background:var(--orange-light); color:#946200; }

  .schedule-grid{ display:grid; grid-template-columns:70px repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
  .sg-cell{ background:#fff; padding:6px 4px; font-size:11.5px; min-height:26px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .sg-head{ background:var(--blue); color:#fff; font-weight:800; padding:10px 4px; }
  .sg-time{ background:#FAFBFC; color:var(--text-sub); font-weight:700; font-size:11px; }
  .sg-lesson{ background:var(--blue-light); color:var(--blue-dark); font-weight:700; border-radius:6px; margin:2px; }
  .sg-conflict{ background:var(--red-light) !important; color:var(--red) !important; font-weight:800; }

  .empty{ text-align:center; color:var(--text-sub); padding:40px 0; font-size:13.5px; }

  .report-modal{ position:fixed; inset:0; background:rgba(25,31,40,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .report-modal-inner{ background:#fff; border-radius:var(--radius-lg); padding:28px; max-width:760px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); }
  .report-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .report-filter{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; padding:14px; background:var(--bg); border-radius:var(--radius-md); }
  .report-filter .form-field label{ display:block; font-size:11.5px; font-weight:700; color:var(--text-sub); margin-bottom:4px; }
  .report-filter select, .report-filter input{ width:auto; min-width:90px; }
  #report-print-area .rp-title{ font-size:19px; font-weight:800; margin:0 0 2px; }
  #report-print-area .rp-sub{ font-size:12.5px; color:var(--text-sub); margin:0 0 18px; }
  #report-print-area .rp-meta{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px 18px; font-size:13px; margin-bottom:18px; background:var(--blue-light); border-radius:var(--radius-sm); padding:14px 16px; }
  #report-print-area .rp-meta b{ color:var(--blue-dark); }
  #report-print-area table{ margin-bottom:6px; }

  @page{ margin:14mm; }
  @media print{
    html, body{ background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body *{ visibility:hidden; }
    #report-print-area, #report-print-area *{ visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #report-print-area{ position:absolute; left:0; top:0; width:100%; padding:0; }
    .report-modal, .report-modal-inner{ position:static; background:none; box-shadow:none; padding:0; max-height:none; overflow:visible; }
    .report-filter, .report-noprint{ display:none !important; }
  }

  /* ============ 모바일(아이폰 등) 화면 대응 ============
     주의: 검색해서 받아온 코드에는 .dashboard-cards / .stats-container / .tab-buttons / .nav-menu /
     .table-container / .schedule-container 같은 클래스가 있었는데, 이 파일에는 그런 클래스가 없어서
     (실제로는 .kpi-grid, .tabs/.tab-btn, .table-scroll, .schedule-grid 를 씁니다) 그대로 붙이면
     대부분 적용되지 않는 죽은 코드가 됩니다. 또 input/select/button 전체에 width:100% !important를
     주면 표 안의 작은 입력칸·삭제버튼까지 전부 늘어나며 표 레이아웃이 깨져서, 실제 클래스명에 맞춰
     다시 작성했습니다. */
  @media (max-width:768px){
    .wrap{ padding:16px 12px 60px; }
    .app-title{ font-size:19px; }
    .app-sub{ font-size:12.5px; }

    .header-row{ flex-direction:column; align-items:stretch; gap:12px; }
    .save-box{ align-items:stretch; }
    .save-box > div{ flex-wrap:wrap; }
    .save-box .btn{ flex:1; justify-content:center; }

    .tab-btn{ padding:10px 12px; font-size:12.5px; }

    .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .kpi{ padding:14px; }
    .kpi-value{ font-size:20px; }
    .kpi-input{ width:64px; font-size:20px; }

    .card{ padding:16px; }
    .card-title{ font-size:15px; }

    .form-grid{ grid-template-columns:1fr; gap:10px; }

    table{ font-size:12.5px; }

    /* 표는 세로로 욱여넣지 않고, 기존처럼 옆으로 스크롤하는 방식을 그대로 유지합니다
       (표 칸 입력폭을 강제로 100%로 늘리면 좁은 화면에서 오히려 더 깨집니다). */
    .schedule-grid{ min-width:640px; }

    .report-modal{ padding:10px; }
    .report-modal-inner{ padding:18px; }
    .report-filter{ padding:10px; gap:8px; }
  }
  @media (max-width:420px){
    .kpi-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <div class="app-title">🎤 레슨 관리 시스템</div>
      <div class="app-sub">보컬레슨 계약서와 연동되는 학생·결제·레슨 관리 도구</div>
    </div>
    <div class="save-box">
      <div id="save-indicator" class="save-indicator">저장 준비 중...</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="exportData()">⬇ 백업 저장</button>
        <button class="btn btn-ghost" onclick="triggerImport()">⬆ 백업 불러오기</button>
        <input id="import-file" type="file" accept="application/json" style="display:none" onchange="importDataFile(this)">
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">대시보드</button>
    <button class="tab-btn" data-tab="students" onclick="switchTab('students')">학생관리</button>
    <button class="tab-btn" data-tab="payments" onclick="switchTab('payments')">결제관리</button>
    <button class="tab-btn" data-tab="lessons" onclick="switchTab('lessons')">레슨기록</button>
    <button class="tab-btn" data-tab="progress" onclick="switchTab('progress')">진행현황</button>
    <button class="tab-btn" data-tab="schedule" onclick="switchTab('schedule')">주간일정</button>
  </div>

  <div id="panel-dashboard" class="panel active"></div>
  <div id="panel-students" class="panel"></div>
  <div id="panel-payments" class="panel"></div>
  <div id="panel-lessons" class="panel"></div>
  <div id="panel-progress" class="panel"></div>
  <div id="panel-schedule" class="panel"></div>
</div>

<div id="report-modal" class="report-modal" style="display:none;">
  <div class="report-modal-inner">
    <div class="report-header report-noprint">
      <div class="card-title" style="margin:0;">학생별 레슨 여정 리포트</div>
      <button class="btn btn-ghost" onclick="closeReport()">닫기 ✕</button>
    </div>
    <div class="report-filter report-noprint">
      <div class="form-field"><label>기간 구분</label>
        <select id="rp-type" onchange="renderReportContent()">
          <option value="all">전체</option>
          <option value="year">연도별</option>
          <option value="quarter">분기별</option>
          <option value="month">월별</option>
        </select>
      </div>
      <div class="form-field"><label>연도</label><input id="rp-year" type="number" style="width:90px;" onchange="renderReportContent()"></div>
      <div class="form-field" id="rp-quarter-field"><label>분기</label>
        <select id="rp-quarter" onchange="renderReportContent()"><option value="1">1분기</option><option value="2">2분기</option><option value="3">3분기</option><option value="4">4분기</option></select>
      </div>
      <div class="form-field" id="rp-month-field"><label>월</label>
        <select id="rp-month" onchange="renderReportContent()">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" style="margin-left:auto;" onclick="printReport()">🖨 인쇄 / PDF로 저장</button>
    </div>
    <div id="report-print-area"></div>
  </div>
</div>

<script>
/* ============ 데이터 (메모리 저장 — 새로고침 시 예시로 초기화됩니다) ============ */
let students = [
  { id:'S001', name:'홍길동(예시)', phone:'010-0000-0000', isMinor:false, guardianName:'', guardianPhone:'', relation:'', note:'특이사항 없음', regDate:'2026-07-01', fee:160000, day:'화', time:'18:00', duration:60, status:'활성' }
];
let payments = [
  { id:'P0001', studentId:'S001', date:'2026-07-01', amount:160000, method:'계좌이체', completed:'Y', refund:'N', refundAmount:0, refundDate:'', refundReason:'' }
];
let lessons = [
  { id:'L00001', studentId:'S001', date:'2026-07-08', status:'정상출석', memo:'' }
];
let manualUnpaid = 0;
let seq = { s:2, p:2, l:2 };

const COUNTED = ['정상출석','노쇼','당일취소','보강완료'];
const DAYS = ['월','화','수','목','금','토','일'];
const DOW_KR = ['일','월','화','수','목','금','토']; // Date.getDay() 인덱스와 매핑

/* ============ 유틸 ============ */
function pad(n, len){ return String(n).padStart(len,'0'); }
function studentById(id){ return students.find(s=>s.id===id); }
function studentName(id){ const s = studentById(id); return s ? s.name : '(삭제된 학생)'; }
function fmtMoney(n){ return (Number(n)||0).toLocaleString('ko-KR') + '원'; }
function fmtNum(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function parseMoney(str){ return Number(String(str==null?'':str).replace(/[^\d]/g,'')) || 0; }
function formatMoneyInput(el){
  const raw = el.value.replace(/[^\d]/g,'');
  el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
}
function autoGrow(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* ============ 표 안 입력칸에서 Tab으로 다음 칸 이동 (수정 시 표 전체가 다시 그려져도 포커스가 튀지 않도록) ============
   학생관리/결제관리/레슨기록 표의 각 입력칸은 값이 바뀌면 onchange가 발생해 renderAll()이 화면을 통째로 다시 그립니다.
   이때 브라우저가 원래 이동하려던 다음 칸이 사라져서 기본 Tab 이동이 깨지고 커서가 표의 첫 칸으로 튑니다.
   그래서 Tab을 직접 가로채, 다시 그려지기 전에 '다음 칸이 무엇인지'를 미리 계산해두고 다시 그려진 뒤 그 칸으로 포커스를 옮깁니다. */
function fkeyFocusables(panel){
  return Array.from(panel.querySelectorAll('input[data-fkey], select[data-fkey], textarea[data-fkey]'))
    .filter(el=>!el.disabled);
}
function selectFieldFocus(el){
  el.focus();
  if((el.tagName==='INPUT' || el.tagName==='TEXTAREA') && typeof el.select==='function'){
    try{ el.select(); }catch(e){}
  }
}
function handleTableTab(e){
  if(e.key !== 'Tab') return;
  const el = e.target;
  if(!el.matches || !el.matches('input[data-fkey], select[data-fkey], textarea[data-fkey]')) return;
  const panel = el.closest('.panel');
  if(!panel) return;
  const list = fkeyFocusables(panel);
  const idx = list.indexOf(el);
  if(idx===-1) return;
  const nextIdx = e.shiftKey ? idx-1 : idx+1;
  const nextEl = list[nextIdx];
  if(!nextEl) return; // 표의 맨 끝/맨 앞이면 기본 동작(다른 요소로 이동)에 맡깁니다
  e.preventDefault();
  const panelId = panel.id;
  const nextKey = nextEl.getAttribute('data-fkey');
  el.blur(); // 값이 바뀐 경우 change -> renderAll()이 동기적으로 여기서 실행되어 표가 다시 그려집니다
  // 다시 그려지지 않았다면 nextEl이 그대로 화면에 남아있으므로 바로 포커스
  if(document.contains(nextEl)){ selectFieldFocus(nextEl); return; }
  // 다시 그려졌다면 같은 자리(data-fkey)를 새 DOM에서 찾아 포커스
  const freshPanel = document.getElementById(panelId);
  const freshEl = freshPanel && freshPanel.querySelector(`[data-fkey="${CSS.escape(nextKey)}"]`);
  if(freshEl) selectFieldFocus(freshEl);
}
document.addEventListener('keydown', handleTableTab, true);

/* ============ 표 가로 스크롤 위치 유지 (수정 시 표가 다시 그려져도 스크롤 바가 맨 앞으로 튀지 않도록) ============ */
function getScrollPos(panelId){
  const panel = document.getElementById(panelId);
  const sc = panel && panel.querySelector('.table-scroll');
  return sc ? sc.scrollLeft : 0;
}
function restoreScrollPos(panelId, pos){
  const panel = document.getElementById(panelId);
  const sc = panel && panel.querySelector('.table-scroll');
  if(sc) sc.scrollLeft = pos;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addMonths(dateStr, months){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}

/* ---- 기수/회차는 저장되지 않고, 매 렌더링마다 아래 함수들로 항상 새로 계산됩니다 ----
   결제 기수 = 해당 학생의 결제를 날짜순(동일일자는 등록순)으로 정렬했을 때의 순번
   레슨 기수/회차 = 해당 학생의 '진행카운트 대상' 레슨만 날짜순으로 정렬 후 4개씩 묶어서 1~4회차→1기, 5~8회차→2기 ... 로 자동 배정
   이렇게 하면 결제를 추가로 등록하면 기수가 즉시 늘어나고, 레슨을 4회 넘게 기록해도 다음 기수로 자동 이월되어
   진행횟수가 "5/4"처럼 초과 표시되는 문제가 발생하지 않습니다. */
function studentPaymentsSorted(studentId){
  return payments.filter(p=>p.studentId===studentId)
    .slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
}
function studentCountedLessonsSorted(studentId){
  return lessons.filter(l=>l.studentId===studentId && COUNTED.includes(l.status))
    .slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));
}
// 결제 1건이 그 학생의 몇 번째 결제인지 (1부터 시작). 못 찾으면 null.
function paymentRank(payment){
  const list = studentPaymentsSorted(payment.studentId);
  const idx = list.findIndex(p=>p.id===payment.id);
  return idx===-1 ? null : idx+1;
}
// 레슨 1건의 기수/회차를 계산 (진행카운트 대상이 아니면 기수/회차 없음 → null)
function lessonBucket(lesson){
  if(!COUNTED.includes(lesson.status)) return null;
  const list = studentCountedLessonsSorted(lesson.studentId);
  const idx = list.findIndex(l=>l.id===lesson.id);
  if(idx===-1) return null;
  const overallPos = idx+1; // 1부터 시작
  const term = Math.ceil(overallPos/4);
  const session = overallPos - (term-1)*4;
  return {term, session};
}

function progressFor(studentId){
  const payList = studentPaymentsSorted(studentId);
  const countedList = studentCountedLessonsSorted(studentId);
  if(payList.length===0 && countedList.length===0) return null;

  const totalCounted = countedList.length;
  const bucketTerm = totalCounted>0 ? Math.ceil(totalCounted/4) : 0;
  const currentTerm = Math.max(payList.length, bucketTerm, 1);

  // 현재 기수에 해당하는 진행횟수만 다시 산정 (기수가 늘어나면 이전 기수분은 자동으로 차감됨)
  const progressCount = Math.max(0, Math.min(4, totalCounted - (currentTerm-1)*4));
  const remaining = Math.max(0, 4-progressCount);

  const pay = payList[currentTerm-1]; // 현재 기수에 대응하는 결제 (아직 결제 전이면 undefined)
  const startDate = pay ? pay.date : null;
  const deadline = startDate ? addMonths(startDate, 2) : null;
  const expired = deadline ? (todayStr() > deadline && remaining>0) : false;
  const needsPayment = progressCount >= 4;
  const noPaymentForCurrentTerm = !pay;
  let refundRate;
  if(progressCount===0) refundRate='100%';
  else if(progressCount===1) refundRate='66.7%(2/3)';
  else if(progressCount===2) refundRate='50%(1/2)';
  else refundRate='0%(환불없음)';
  return {currentTerm, progressCount, remaining, startDate, deadline, expired, needsPayment, refundRate, noPaymentForCurrentTerm};
}

function hasConflict(student){
  if(student.status!=='활성' || !student.day || !student.time) return false;
  return students.some(s => s.id!==student.id && s.status==='활성' && s.day===student.day && s.time===student.time);
}

/* ============ 대시보드 계산 ============ */
function totalStudents(){ return students.length; }
function activeStudents(){ return students.filter(s=>s.status==='활성').length; }
function thisMonthRevenue(){
  const ym = todayStr().slice(0,7);
  return payments.filter(p=>p.date && p.date.slice(0,7)===ym).reduce((sum,p)=>sum+Number(p.amount||0),0);
}
function studentsNeedingPayment(){
  return students.filter(s=>{ const p = progressFor(s.id); return p && p.needsPayment; }).length;
}

/* ============ 저장 (브라우저 로컬 자동저장 + 백업 파일) ============ */
const STORAGE_KEY = 'lesson_mgmt_v1';
let storageAvailable = true;

function saveToLocalStorage(){
  try{
    const data = { students, payments, lessons, manualUnpaid, seq };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    storageAvailable = true;
  }catch(e){
    storageAvailable = false; // 브라우저가 로컬저장을 막아둔 경우(파일 직접 열기 등) — 백업 파일로 대체 안내
  }
  updateSaveIndicator();
}

function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data.students) students = data.students;
    if(data.payments) payments = data.payments;
    if(data.lessons) lessons = data.lessons;
    if(typeof data.manualUnpaid === 'number') manualUnpaid = data.manualUnpaid;
    if(data.seq) seq = data.seq;
    return true;
  }catch(e){ return false; }
}

function updateSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  if(storageAvailable){
    const now = new Date();
    el.textContent = '이 브라우저에 자동 저장됨 · ' + now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    el.style.color = 'var(--green)';
  }else{
    el.textContent = '⚠ 이 브라우저에서는 자동 저장이 안 돼요 — 백업 저장 버튼을 이용하세요';
    el.style.color = 'var(--red)';
  }
}

function exportData(){
  const data = { students, payments, lessons, manualUnpaid, seq, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `레슨관리_백업_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ CSV 내보내기 (엑셀에서 바로 열리도록 UTF-8 BOM 포함) ============ */
function csvCell(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportCsv(type){
  if(type==='students'){
    const rows = [['학생ID','학생명','연락처','미성년자','법정대리인','대리인연락처','관계','특이사항','등록일','레슨비','요일','시간','레슨시간(분)','상태']];
    students.forEach(s=> rows.push([s.id,s.name,s.phone,s.isMinor?'Y':'N',s.guardianName,s.guardianPhone,s.relation,s.note,s.regDate,s.fee,s.day,s.time,s.duration,s.status]));
    downloadCsv(`학생목록_${todayStr()}.csv`, rows);
  }else if(type==='payments'){
    const rows = [['결제ID','학생ID','학생명','입금일','금액','수단','기수(자동)','완료','환불','환불액','환불일','환불사유']];
    payments.forEach(p=> rows.push([p.id,p.studentId,studentName(p.studentId),p.date,p.amount,p.method,paymentRank(p),p.completed,p.refund,p.refundAmount,p.refundDate,p.refundReason]));
    downloadCsv(`결제내역_${todayStr()}.csv`, rows);
  }else if(type==='lessons'){
    const rows = [['기록ID','학생ID','학생명','기수(자동)','회차(자동)','날짜','출석상태','진행카운트','메모']];
    lessons.forEach(l=>{
      const bk = lessonBucket(l);
      rows.push([l.id,l.studentId,studentName(l.studentId),bk?bk.term:'',bk?bk.session:'',l.date,l.status,COUNTED.includes(l.status)?1:0,l.memo||'']);
    });
    downloadCsv(`레슨기록_${todayStr()}.csv`, rows);
  }else if(type==='progress'){
    const rows = [['학생ID','학생명','현재기수','진행횟수','잔여회차','기시작일','유효기간마감일','유효기간상태','다음결제필요','예상환불비율']];
    students.forEach(s=>{
      const p = progressFor(s.id); if(!p) return;
      // 엑셀은 "2/4" 같은 값을 날짜(02월 04일)로 자동 변환해버리므로, ="2/4" 형태로 내보내
      // 엑셀이 수식으로 인식해 그대로 "2/4" 텍스트로 표시되도록 처리합니다.
      rows.push([s.id,s.name,p.currentTerm,`="${p.progressCount}/4"`,p.remaining,p.startDate||'',p.deadline||'',p.expired?'경과(소멸대상)':'정상',p.needsPayment?'Y':'N',p.refundRate]);
    });
    downloadCsv(`진행현황_${todayStr()}.csv`, rows);
  }
}

function triggerImport(){
  document.getElementById('import-file').click();
}

function importDataFile(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('현재 화면의 데이터를 이 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
      students = data.students || [];
      payments = data.payments || [];
      lessons = data.lessons || [];
      manualUnpaid = typeof data.manualUnpaid==='number' ? data.manualUnpaid : 0;
      seq = data.seq || {s:students.length+1, p:payments.length+1, l:lessons.length+1};
      renderAll();
      alert('불러오기가 완료되었습니다.');
    }catch(err){
      alert('파일을 읽을 수 없습니다. 이 시스템에서 저장한 백업(.json) 파일이 맞는지 확인해주세요.');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
}

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  renderAll();
}

  renderDashboard();
  renderStudents();
  renderPayments();
  renderLessons();
  renderProgress();
  renderSchedule();
  saveToLocalStorage();
}

function todayLabel(){
  const d = new Date();
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW_KR[d.getDay()]})`;
}
function renderTodaySchedule(){
  const dow = DOW_KR[new Date().getDay()];
  const todays = students.filter(s=>s.status==='활성' && s.day===dow)
    .slice().sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  if(todays.length===0) return `<div class="empty">오늘(${dow}) 예정된 레슨이 없습니다</div>`;
  return `<table><thead><tr><th>시간</th><th>학생명</th><th>연락처</th><th>레슨시간(분)</th><th>겹침</th></tr></thead><tbody>
    ${todays.map(s=>{
      const conflict = hasConflict(s);
      return `<tr class="${conflict?'conflict':''}"><td><b>${escapeHtml(s.time)}</b></td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.phone||'')}</td><td>${s.duration}</td><td>${conflict?'<span class="badge badge-red">⚠겹침</span>':''}</td></tr>`;
    }).join('')}
  </tbody></table>`;
}

function renderConflictList(){
  const conflicts = students.filter(s=>hasConflict(s));
  if(conflicts.length===0) return `<div class="empty">현재 겹치는 예약이 없습니다 ✅</div>`;
  return `<table><thead><tr><th>학생명</th><th>요일</th><th>시간</th></tr></thead><tbody>
    ${conflicts.map(s=>`<tr class="conflict"><td>⚠ ${s.name}</td><td>${s.day}</td><td>${s.time}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ============ 주간일정 (학생관리 데이터로 자동 렌더링) ============ */
function timeToMinutes(t){
  const m = /^(\d{1,2}):(\d{2})$/.exec((t||'').trim());
  if(!m) return null;
  return Number(m[1])*60 + Number(m[2]);
}
function renderSchedule(){
  const el = document.getElementById('panel-schedule');
  const startMin = 9*60, endMin = 22*60, step = 30;
  const slots = [];
  for(let t=startMin; t<endMin; t+=step) slots.push(t);

  // 각 학생을 슬롯에 배치
  const occupied = {}; // "day|slot" -> [studentNames]
  students.filter(s=>s.status==='활성').forEach(s=>{
    const start = timeToMinutes(s.time);
    if(start===null || !DAYS.includes(s.day)) return;
    const dur = Number(s.duration)||60;
    const slotCount = Math.max(1, Math.ceil(dur/step));
    for(let i=0;i<slotCount;i++){
      const slot = start + i*step;
      const key = s.day+'|'+slot;
      if(!occupied[key]) occupied[key]=[];
      occupied[key].push(s.name);
    }
  });

  let grid = `<div class="schedule-grid">`;
  grid += `<div class="sg-cell sg-head">시간</div>`;
  DAYS.forEach(d=> grid += `<div class="sg-cell sg-head">${d}</div>`);
  slots.forEach(slot=>{
    const hh = String(Math.floor(slot/60)).padStart(2,'0');
    const mm = String(slot%60).padStart(2,'0');
    grid += `<div class="sg-cell sg-time">${hh}:${mm}</div>`;
    DAYS.forEach(d=>{
      const names = occupied[d+'|'+slot] || [];
      const conflict = names.length>1;
      const cls = conflict ? 'sg-cell sg-conflict' : (names.length? 'sg-cell sg-lesson':'sg-cell');
      grid += `<div class="${cls}">${names.join(', ')}</div>`;
    });
  });
  grid += `</div>`;

  el.innerHTML = `
    <div class="card">
      <div class="note">학생관리에 입력된 요일·시간·레슨시간을 기준으로 자동으로 그려집니다. 직접 칸을 채울 필요가 없고, 겹치는 시간은 빨간색으로 자동 표시됩니다. 운영시간은 09:00~22:00 기준입니다(다르면 알려주시면 조정해 드립니다).</div>
      <div class="table-scroll">${grid}</div>
    </div>
  `;
}

/* ============ 학생별 레슨 여정 리포트 (PDF 인쇄) ============ */
let reportStudentId = null;

function openReport(studentId){
  reportStudentId = studentId;
  document.getElementById('rp-type').value = 'all';
  document.getElementById('rp-year').value = new Date().getFullYear();
  document.getElementById('rp-quarter').value = String(Math.ceil((new Date().getMonth()+1)/3));
  document.getElementById('rp-month').value = String(new Date().getMonth()+1);
  document.getElementById('report-modal').style.display = 'flex';
  renderReportContent();
}
function closeReport(){
  document.getElementById('report-modal').style.display = 'none';
  reportStudentId = null;
}
function printReport(){
  // 브라우저 인쇄 시 상단에 자동으로 붙는 제목(문서 title)에 '레슨 관리 시스템'이 노출되지 않도록
  // 인쇄 직전에만 학생명 기반 제목으로 바꿨다가 인쇄 후 원래 제목으로 되돌립니다.
  const original = document.title;
  const s = studentById(reportStudentId);
  document.title = s ? `${s.name} 레슨 리포트` : '레슨 리포트';
  const restore = () => { document.title = original; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  setTimeout(restore, 1500); // afterprint 미지원 환경 대비
}
function reportPeriodLabel(type, year, quarter, month){
  if(type==='year') return `${year}년`;
  if(type==='quarter') return `${year}년 ${quarter}분기`;
  if(type==='month') return `${year}년 ${month}월`;
  return '전체 기간';
}
function lessonInPeriod(dateStr, type, year, quarter, month){
  if(type==='all') return true;
  if(!dateStr) return false;
  const [y, m] = dateStr.split('-').map(Number);
  if(type==='year') return y===year;
  if(type==='quarter') return y===year && Math.ceil(m/3)===quarter;
  if(type==='month') return y===year && m===month;
  return true;
}

  const allLessons = lessons.filter(l=>l.studentId===reportStudentId)
    .slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id.localeCompare(b.id));

    <div class="card-title" style="font-size:14px;">기간 내 레슨 기록 (${periodLessons.length}건)</div>
    ${periodLessons.length===0 ? '<div class="empty">해당 기간에 레슨 기록이 없습니다</div>' : `
    <table><thead><tr><th>날짜</th><th>기수/회차</th><th>출석상태</th><th>메모</th></tr></thead><tbody>
      ${periodLessons.map(l=>{
        const bk = lessonBucket(l);
        return `<tr><td>${l.date}</td><td>${bk? bk.term+'기 '+bk.session+'회차' : '-'}</td><td>${escapeHtml(l.status)}</td><td>${escapeHtml(l.memo||'')}</td></tr>`;
      }).join('')}
    </tbody></table>`}
  `;
}

/* ============ 초기 렌더 ============ */
loadFromLocalStorage();
renderAll();
</script>
</body>
</html>
